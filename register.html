<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | Aurelia Clinical Aesthetics</title>
  <meta name="description" content="Register for your private client account at Aurelia Clinical Aesthetics. Access personalized treatment plans, doctor consultations, and luxury benefits.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="min-height: 100vh; margin: 0; display: flex; flex-direction: column;">

  <canvas id="ambient-canvas"></canvas>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative;">

    <!-- Top Controls OUTSIDE THE BOX -->
    <div class="auth-page-top-controls">
      <button class="theme-toggle-btn" aria-label="Toggle Dark or Light Mode"></button>
      <button class="rtl-toggle-btn" aria-label="Toggle RTL View">
        <span class="rtl-text">RTL</span>
      </button>
    </div>

    <!-- REGISTER CARD SECTION -->
    <section class="section" id="register-card-section" style="width: 100%; padding: 4rem 1rem 2rem 1rem; background: transparent;">
      <div class="container">
        <div class="auth-card-container">
          <!-- Card Header with Brand Logo -->
          <div class="auth-card-header">
            <a href="index.html" class="brand" style="justify-content: center; margin-bottom: var(--space-3);" aria-label="Aurelia Clinical Aesthetics Home">
              <div class="brand-logo">
                <svg class="logo-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="brand-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#F5E4B3"/>
                      <stop offset="50%" stop-color="#D4AF37"/>
                      <stop offset="100%" stop-color="#9A7B38"/>
                    </linearGradient>
                  </defs>
                  <circle cx="50" cy="50" r="44" stroke="url(#brand-gold-grad)" stroke-width="2.5" fill="none" opacity="0.85"/>
                  <circle cx="50" cy="50" r="38" stroke="url(#brand-gold-grad)" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.5"/>
                  <path d="M50 14 L56 34 L50 40 L44 34 Z" fill="url(#brand-gold-grad)"/>
                  <path d="M50 86 L56 66 L50 60 L44 66 Z" fill="url(#brand-gold-grad)"/>
                  <path d="M14 50 L34 44 L40 50 L34 56 Z" fill="url(#brand-gold-grad)"/>
                  <path d="M86 50 L66 44 L60 50 L66 56 Z" fill="url(#brand-gold-grad)"/>
                  <path d="M50 24 L65 72 H56.5 L52 57 H48 L43.5 72 H35 L50 24 Z M50 37 L45.5 49.5 H54.5 L50 37 Z" fill="url(#brand-gold-grad)"/>
                </svg>
              </div>
              <div class="brand-text" style="text-align: left;">
                <span class="brand-title">AURELIA</span>
                <span class="brand-subtitle">CLINICAL AESTHETICS</span>
              </div>
            </a>
            <h2 class="auth-card-title">Create Your Account</h2>
            <p class="auth-card-subtitle">Join Aurelia Aesthetics and start booking your tailored treatments.</p>
          </div>

          <form id="register-form" data-validate="true">
            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-firstname">First Name</label>
              <input type="text" id="reg-firstname" class="auth-form-input" placeholder="John" required>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-lastname">Last Name</label>
              <input type="text" id="reg-lastname" class="auth-form-input" placeholder="Doe" required>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-email">Email Address</label>
              <input type="email" id="reg-email" class="auth-form-input" placeholder="hello@pawsandbubbles.com" required>
            </div>

            <div class="auth-form-group">
              <label class="auth-form-label" for="reg-password">Password</label>
              <input type="password" id="reg-password" class="auth-form-input" placeholder="••••••••••••" required minlength="8">
              <span class="auth-input-hint">At least 8 characters long</span>
            </div>

            <div class="auth-options-row" style="margin-bottom: var(--space-4);">
              <label class="auth-checkbox-label">
                <input type="checkbox" id="terms-agree" required checked>
                <span>I agree to the <a href="about.html" style="color: var(--accent-gold); text-decoration: underline;">Terms of Service</a> and <a href="about.html" style="color: var(--accent-gold); text-decoration: underline;">Privacy Policy</a></span>
              </label>
            </div>

            <button type="submit" class="btn btn-gold btn-auth-submit">Create Account</button>
          </form>

          <div class="auth-divider">
            <span>OR</span>
          </div>

          <div class="auth-social-grid">
            <button type="button" class="btn-social" onclick="if(window.showToast) window.showToast('Google Registration initialized.', 'info')">
              <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
              Google
            </button>
            <button type="button" class="btn-social" onclick="if(window.showToast) window.showToast('Apple Registration initialized.', 'info')">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.67-.82 1.12-1.95.99-3.08-1 .04-2.2.67-2.91 1.5-.64.74-1.2 1.91-1.05 3.03 1.12.09 2.25-.56 2.97-1.45z"/></svg>
              Apple
            </button>
          </div>

          <div class="auth-card-footer">
            Already have an account? <a href="login.html">Sign In</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/particles.js"></script>
  <script src="assets/js/tilt.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
