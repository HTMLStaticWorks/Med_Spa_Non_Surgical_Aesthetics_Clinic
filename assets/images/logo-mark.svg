<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aurelia-gold-mark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="25%" stop-color="#F2D283"/>
      <stop offset="60%" stop-color="#D4AA47"/>
      <stop offset="85%" stop-color="#B88A2D"/>
      <stop offset="100%" stop-color="#8C651B"/>
    </linearGradient>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer solid ring -->
  <circle cx="50" cy="50" r="45" stroke="url(#aurelia-gold-mark)" stroke-width="1.8" fill="none" filter="url(#mark-glow)"/>
  <!-- Inner beaded ring -->
  <circle cx="50" cy="50" r="40" stroke="url(#aurelia-gold-mark)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="0.1 3.2" fill="none" opacity="0.85"/>
  
  <!-- Top Crown Spire (Diamond & Lance) -->
  <path d="M50 14 L53 25 L50 30 L47 25 Z" fill="url(#aurelia-gold-mark)"/>
  <circle cx="50" cy="13" r="1.2" fill="url(#aurelia-gold-mark)"/>

  <!-- Bottom Pendant Quill -->
  <path d="M50 86 L53 74 L50 69 L47 74 Z" fill="url(#aurelia-gold-mark)"/>
  <circle cx="50" cy="87" r="1.2" fill="url(#aurelia-gold-mark)"/>

  <!-- Left Wing Feathers -->
  <path d="M44 48 C37 47, 26 46, 17 48 C22 51, 28 54, 34 56 C38 55, 42 52, 44 48 Z" fill="url(#aurelia-gold-mark)"/>
  <path d="M42 53 C36 54, 27 56, 21 59 C26 62, 33 62, 37 60 C40 58, 41 55, 42 53 Z" fill="url(#aurelia-gold-mark)" opacity="0.9"/>
  <path d="M40 58 C35 60, 29 63, 26 66 C30 67, 35 66, 38 64 C40 62, 40 60, 40 58 Z" fill="url(#aurelia-gold-mark)" opacity="0.75"/>

  <!-- Right Wing Feathers -->
  <path d="M56 48 C63 47, 74 46, 83 48 C78 51, 72 54, 66 56 C62 55, 58 52, 56 48 Z" fill="url(#aurelia-gold-mark)"/>
  <path d="M58 53 C64 54, 73 56, 79 59 C74 62, 67 62, 63 60 C60 58, 59 55, 58 53 Z" fill="url(#aurelia-gold-mark)" opacity="0.9"/>
  <path d="M60 58 C65 60, 71 63, 74 66 C70 67, 65 66, 62 64 C60 62, 60 60, 60 58 Z" fill="url(#aurelia-gold-mark)" opacity="0.75"/>

  <!-- Regal Letter A with Sculpted Serifs -->
  <path d="M50 24 L64 69 H58.2 L54 55 H46 L42 69 H36.2 L50 24 Z M50 35 L47 49.5 H53 L50 35 Z" fill="url(#aurelia-gold-mark)"/>
  <path d="M34 68.5 H44 V70 H34 Z M56 68.5 H66 V70 H56 Z" fill="url(#aurelia-gold-mark)"/>
</svg>
