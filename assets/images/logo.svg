    <path d="M44 48 C37 47, 26 46, 17 48 C22 51, 28 54, 34 56 C38 55, 42 52, 44 48 Z" fill="url(#aurelia-gold-l)"/>
    <path d="M42 53 C36 54, 27 56, 21 59 C26 62, 33 62, 37 60 C40 58, 41 55, 42 53 Z" fill="url(#aurelia-gold-l)" opacity="0.9"/>
    <path d="M40 58 C35 60, 29 63, 26 66 C30 67, 35 66, 38 64 C40 62, 40 60, 40 58 Z" fill="url(#aurelia-gold-l)" opacity="0.75"/>
    <!-- Right Wing -->
