      <stop offset="25%" stop-color="#DDB766"/>
      <stop offset="60%" stop-color="#C09536"/>
      <stop offset="85%" stop-color="#A1751F"/>
      <stop offset="100%" stop-color="#7B540E"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Plus+Jakarta+Sans:wght@600&amp;display=swap');
